name: Build and Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore Nightowl.slnx

      - name: Run automated tests
        run: dotnet test tests/Nightowl.Tests/Nightowl.Tests.csproj --no-restore

      - name: Build & Publish Android APK
        run: |
          dotnet publish src/Nightowl.Maui/Nightowl.Maui.csproj -f net10.0-android -c Release
          Copy-Item src/Nightowl.Maui/bin/Release/net10.0-android/publish/*-Signed.apk -Destination nightowl.apk -Force

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightowl-android-apk
          path: nightowl.apk
          if-no-files-found: error
