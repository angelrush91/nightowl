name: Build and Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish or update GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Android APK
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore Nightowl.slnx

      - name: Run automated tests
        run: dotnet test tests/Nightowl.Tests/Nightowl.Tests.csproj --no-restore

      - name: Verify Android Signing Keystore
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ($env:KEYSTORE_BASE64) {
            Write-Host "Restoring nightowl.keystore from ANDROID_KEYSTORE_BASE64 secret..."
            [System.IO.File]::WriteAllBytes("nightowl.keystore", [System.Convert]::FromBase64String($env:KEYSTORE_BASE64))
          }
          if (-not (Test-Path "nightowl.keystore")) {
            throw "nightowl.keystore was not found in repository root and ANDROID_KEYSTORE_BASE64 secret is not configured."
          }
          Write-Host "Android signing keystore verified successfully (Size: $((Get-Item 'nightowl.keystore').Length) bytes)."

      - name: Build & Publish Android APK
        shell: pwsh
        run: |
          dotnet publish src/Nightowl.Maui/Nightowl.Maui.csproj -f net10.0-android -c Release
          $apk = Get-ChildItem -Path "src/Nightowl.Maui/bin/Release/net10.0-android/publish" -Filter "*-Signed.apk" | Select-Object -First 1
          if (-not $apk) {
            throw "Signed APK not found in publish directory."
          }
          Write-Host "Found signed APK: $($apk.FullName)"
          Copy-Item $apk.FullName -Destination "nightowl.apk" -Force

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightowl-android-apk
          path: nightowl.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: nightowl.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
