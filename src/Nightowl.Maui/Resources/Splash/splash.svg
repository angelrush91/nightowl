<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="owlGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="crestGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="eyeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bookCoverGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="pageGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Ambient Moon / Celestial Aura behind Owl -->
  <circle cx="228" cy="228" r="145" fill="#4338ca" opacity="0.25" />
  <circle cx="228" cy="228" r="130" fill="#6366f1" opacity="0.15" />

  <!-- Open Book at Base (Perch) -->
  <!-- Book Cover Background -->
  <path d="M 228,348 Q 170,362 110,342 L 114,354 Q 170,374 228,360 Q 286,374 342,354 L 346,342 Q 286,362 228,348 Z" fill="url(#bookCoverGradient)" />
  <!-- Left Page Stack -->
  <path d="M 228,336 Q 175,348 116,332 L 118,344 Q 175,360 228,348 Z" fill="#cbd5e1" />
  <!-- Right Page Stack -->
  <path d="M 228,336 Q 281,348 340,332 L 338,344 Q 281,360 228,348 Z" fill="#cbd5e1" />
  <!-- Left Main Page -->
  <path d="M 228,322 C 185,334 150,330 118,324 C 117,329 116,335 116,338 C 150,344 185,346 228,336 Z" fill="url(#pageGradient)" />
  <!-- Right Main Page -->
  <path d="M 228,322 C 271,334 306,330 338,324 C 339,329 340,335 340,338 C 306,344 271,346 228,336 Z" fill="url(#pageGradient)" />
  <!-- Book Page Lines (Left) -->
  <path d="M 140,330 Q 180,336 215,329" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
  <!-- Book Page Lines (Right) -->
  <path d="M 241,329 Q 276,336 316,330" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />

  <!-- Owl Body Silhouette -->
  <path d="M 148,110 
           C 178,142 205,146 228,146 
           C 251,146 278,142 308,110 
           C 318,155 334,210 326,270 
           C 318,320 278,332 228,332 
           C 178,332 138,320 130,270 
           C 122,210 138,155 148,110 Z" 
        fill="url(#owlGradient)" 
        stroke="#4f46e5" 
        stroke-width="3" />

  <!-- Owl Chest Feathers (Layered scallops) -->
  <path d="M 195,275 Q 228,295 261,275" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <path d="M 205,292 Q 228,306 251,292" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" opacity="0.6" />

  <!-- Owl Brow / Mask Crest -->
  <path d="M 148,110 
           C 182,152 212,175 228,198 
           C 244,175 274,152 308,110 
           C 292,165 268,188 228,198 
           C 188,188 164,165 148,110 Z" 
        fill="url(#crestGradient)" />

  <!-- Left Eye Outer Socket -->
  <circle cx="178" cy="218" r="38" fill="#1e1b4b" stroke="#6366f1" stroke-width="3.5" />
  <!-- Left Eye Iris (Glowing Amber) -->
  <circle cx="178" cy="218" r="26" fill="url(#eyeGradient)" />
  <!-- Left Eye Pupil -->
  <circle cx="178" cy="218" r="14" fill="#090d16" />
  <!-- Left Eye Catchlights -->
  <circle cx="171" cy="211" r="5" fill="#ffffff" />
  <circle cx="184" cy="224" r="2.5" fill="#ffffff" opacity="0.8" />

  <!-- Right Eye Outer Socket -->
  <circle cx="278" cy="218" r="38" fill="#1e1b4b" stroke="#6366f1" stroke-width="3.5" />
  <!-- Right Eye Iris (Glowing Amber) -->
  <circle cx="278" cy="218" r="26" fill="url(#eyeGradient)" />
  <!-- Right Eye Pupil -->
  <circle cx="278" cy="218" r="14" fill="#090d16" />
  <!-- Right Eye Catchlights -->
  <circle cx="271" cy="211" r="5" fill="#ffffff" />
  <circle cx="284" cy="224" r="2.5" fill="#ffffff" opacity="0.8" />

  <!-- Beak -->
  <path d="M 221,216 Q 228,212 235,216 L 228,252 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round" />
  <path d="M 228,214 L 228,252" stroke="#b45309" stroke-width="1" opacity="0.5" />

  <!-- Talons clutching the book -->
  <ellipse cx="205" cy="326" rx="6" ry="4" fill="#f59e0b" />
  <ellipse cx="215" cy="327" rx="5" ry="4" fill="#f59e0b" />
  <ellipse cx="241" cy="327" rx="5" ry="4" fill="#f59e0b" />
  <ellipse cx="251" cy="326" rx="6" ry="4" fill="#f59e0b" />
</svg>